<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sednica skupštine stanara</title>
<link rel="manifest" href="manifest-stanari.json">
<link rel="apple-touch-icon" href="ikona-stanari.png">
<link rel="icon" href="ikona-stanari.png">
<meta name="theme-color" content="#1565c0">
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f2f4f7;color:#1a1a1a}
  .w{max-width:520px;margin:0 auto;padding:14px}
  h1{font-size:20px;margin:6px 0 12px}
  .k{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
  input,select{font-size:20px;padding:11px;width:100%;box-sizing:border-box;margin-top:8px}
  button{font-size:17px;padding:13px;border:0;border-radius:8px;background:#1565c0;color:#fff;width:100%;margin-top:8px}
  .g{display:flex;gap:6px}.g button{margin-top:6px;font-size:15px;padding:12px 4px}
  .za{background:#2e7d32}.pr{background:#c62828}.uz{background:#757575}
  .st{display:inline-block;padding:3px 10px;border-radius:12px;color:#fff;font-size:13px}
  .o{background:#2e7d32}.z{background:#555}
  .m{color:#c62828;margin-top:8px}
  .q{text-align:center;font-size:22px;font-weight:bold;color:#fff}.qy{background:#2e7d32}.qn{background:#c62828}
  .qs{font-size:15px;font-weight:normal;margin-top:4px}
  .bar{height:10px;background:#fff5;border-radius:5px;margin-top:8px;overflow:hidden}.bar div{height:10px;background:#fff}
  table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:5px;text-align:left}
  .us{color:#2e7d32;font-weight:bold}.ne{color:#c62828;font-weight:bold}
  .pb{display:none}
  @media print{button,#pinbox{display:none}.pb{display:block}}
</style>
</head>
<body>
<div class="w">
  <h1>SEDNICA SKUPŠTINE STANARA</h1>
  <div id="pinbox" class="k">
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="Upiši svoj PIN (4 cifre sa računa)">
    <button onclick="uloguj()">UĐI</button>
    <div id="m" class="m"></div>
  </div>
  <div id="sadrzaj"></div>
</div>
<script src="config.js"></script>
<script>
let L = null, tajmer = null, ZGR = '';

function rpc(fn, args) {
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function uloguj() {
  L = { p_zgrada: '', p_stan: '', p_pin: document.getElementById('pin').value.trim() };
  if (!L.p_pin) { document.getElementById('m').textContent = 'Upiši svoj PIN.'; return; }
  ucitaj();
}
function ucitaj() {
  rpc('stanje', L).then(prikazi).catch(function (e) { document.getElementById('m').textContent = 'Greška: ' + e.message; });
}

function prikazi(d) {
  const m = document.getElementById('m'), box = document.getElementById('sadrzaj');
  if (d.greska) { m.textContent = d.greska; box.innerHTML = ''; document.getElementById('pinbox').style.display = ''; clearInterval(tajmer); return; }
  m.textContent = '';
  ZGR = d.zgrada;
  document.getElementById('pinbox').style.display = 'none';
  clearInterval(tajmer);
  if (d.nema) {
    box.innerHTML = '<div class="k">Zdravo, ' + esc(d.ime) + ' (stan ' + esc(d.stan) + '). Za vašu zgradu trenutno nema sednice.</div><button class="uz" onclick="istorija()">ISTORIJA ZAPISNIKA</button>';
    tajmer = setInterval(ucitaj, 10000); return;
  }
  const s = d.sednica, otv = s.status === 'OTVORENA', q = d.kvorum;
  let h = '<div class="k">' + (s.ponovljena ? '<b>PONOVLJENA SEDNICA</b><br>' : '') + '<b>ZGRADA:</b> ' + esc(s.zgrada) +
    '<br><b>BROJ POSEBNIH DELOVA:</b> ' + s.ukupno +
    '<br><b>SASTANAK DANA:</b> ' + esc(s.datum) + ' u ' + esc(s.vreme) +
    '<br><b>MESTO SASTANKA:</b> ' + esc(s.mesto) +
    '<br><span class="st ' + (otv ? 'o' : 'z') + '">' + (otv ? (s.otvorene.length ? 'GLASANJE JE OTVORENO (tačka ' + s.otvorene.join(', ') + ')' : 'SEDNICA JE U TOKU - RASPRAVA') : 'ZAVRŠENO') + '</span></div>';

  const pr = Math.min(100, Math.round(q.prisutno / Math.max(1, q.potrebno) * 100));
  h += '<div class="k q ' + (q.ima ? 'qy' : 'qn') + '">' + (q.ima ? 'IMA KVORUMA' : 'NEMA KVORUMA') +
    '<div class="qs">Prisutno: ' + q.prisutno + ' od ' + q.ukupno + ' (potrebno ' + q.potrebno + ')</div>' +
    '<div class="bar"><div style="width:' + pr + '%"></div></div></div>';

  h += realizacijaHtml(d.realizacija);
  h += hitneHtml(d.hitne);
  h += '<div class="k"><b>Stan ' + esc(d.stan) + ' - ' + esc(d.ime) + '</b>';
  if (d.pravo === false) h += '<div class="ne">Vaš posebni deo (garaža ili poslovni prostor) nema pravo glasa na ovoj sednici.</div>';
  else if (otv && !d.prisutan) h += '<button onclick="budiPrisutan()">POTVRĐUJEM PRISUSTVO (NA DALJINU)</button>';
  else if (d.prisutan) h += '<div class="us">PRISUTAN</div>';
  h += '</div>';

  h += '<div class="k"><b>DNEVNI RED</b>';
  s.tacke.forEach(function (t, i) {
    const n = i + 1, moj = d.moji[n], po = (d.ponude && d.ponude[n]) || [];
    h += '<div style="margin-top:12px"><b>' + n + '.</b> ' + esc(t);
    if (po.length) h += '<div><b>Pristigle ponude:</b>' + ponudeHtml(po) + '</div>';
    if (moj) h += '<div class="us">Vaš glas: ' + esc(glasLabel(moj, po)) + '</div>';
    else if (otv && d.prisutan && d.pravo !== false && s.otvorene.indexOf(n) >= 0) {
      if (po.length) {
        h += '<div style="display:flex;flex-direction:column">' + po.map(function (p) {
          return '<button class="za" onclick="glasaj(' + n + ',\'PONUDA:' + p.id + '\')">ZA PONUDU: ' + esc(p.ponudjac) + '</button>';
        }).join('') + '<button class="pr" onclick="glasaj(' + n + ',\'PROTIV\')">PROTIV SVIH PONUDA</button>' +
          '<button class="uz" onclick="glasaj(' + n + ',\'UZDRŽAN\')">UZDRŽAN</button></div>';
      } else {
        h += '<div class="g">' +
          '<button class="za" onclick="glasaj(' + n + ',\'ZA\')">ZA</button>' +
          '<button class="pr" onclick="glasaj(' + n + ',\'PROTIV\')">PROTIV</button>' +
          '<button class="uz" onclick="glasaj(' + n + ',\'UZDRŽAN\')">UZDRŽAN</button></div>';
      }
    } else if (otv && d.prisutan && d.pravo !== false) {
      h += '<div style="color:#666;margin-top:4px">Rasprava je u toku - glasanje o ovoj tački još nije otvoreno.</div>';
    }
    if (d.rezultati) h += rezHtml(d.rezultati[i]);
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="k"><b>PRISUTNI (' + d.prisutni.length + ')</b><table><tr><th>Stan</th><th>Ime</th><th>Način</th></tr>';
  d.prisutni.forEach(function (p) {
    h += '<tr><td>' + esc(p.stan) + '</td><td>' + esc(p.ime) + '</td><td>' + esc(p.nacin) + '</td></tr>';
  });
  h += '</table></div>';
  if (!otv) h += '<button onclick="window.print()">ŠTAMPAJ / SAČUVAJ PDF</button>';
  h += '<button class="uz" onclick="istorija()">ISTORIJA ZAPISNIKA</button>';
  box.innerHTML = h;
  if (otv) tajmer = setInterval(ucitaj, 5000);
}

function glasLabel(g, ponude) {
  if (g && String(g).indexOf('PONUDA:') === 0) {
    const id = String(g).slice(7), p = (ponude || []).filter(function (x) { return String(x.id) === id; })[0];
    return 'ponuda: ' + (p ? p.ponudjac : id);
  }
  return g;
}
function ponudeHtml(lst) {
  return lst.map(function (p) {
    return '<div style="margin:6px 0;padding:6px;background:#f6f8fb;border-radius:6px"><b>' + esc(p.ponudjac) + '</b>' +
      (p.iznos ? ' - ' + esc(p.iznos) : '') + (p.opis ? '<br>' + esc(p.opis) : '') +
      (/^https?:\/\//i.test(p.link || '') ? '<br><a href="' + esc(p.link) + '" target="_blank" rel="noopener">Pogledaj ponudu</a>' : '') + '</div>';
  }).join('');
}
function rezHtml(r) {
  if (r.ponude) {
    return '<div>' + r.ponude.map(function (p) {
      return esc(p.ponudjac) + (p.iznos ? ' (' + esc(p.iznos) + ')' : '') + ': ' + p.glasova + ' glasova';
    }).join('<br>') + '<br>PROTIV SVIH: ' + r.protiv + ' | UZDRŽANO: ' + r.uzdrzan +
      '<br><b class="' + (r.usvojeno ? 'us' : 'ne') + '">' + (r.usvojeno ? 'USVOJENA PONUDA: ' + esc(r.pobednik) : 'NIJE USVOJENO') + '</b></div>';
  }
  return '<div>ZA: ' + r.za + ' | PROTIV: ' + r.protiv + ' | UZDRŽANO: ' + r.uzdrzan +
    '<br><b class="' + (r.usvojeno ? 'us' : 'ne') + '">' + (r.usvojeno ? 'USVOJENO' : 'NIJE USVOJENO') + '</b></div>';
}

function hitneHtml(l) {
  if (!l || !l.length) return '';
  let h = '<div class="k"><b>IZVEŠTAJ O HITNOJ INTERVENCIJI</b>';
  l.forEach(function (x) {
    h += '<div style="margin-top:8px">Prijavljeno: ' + esc(x.datum) + ' u ' + esc(x.vreme) + (x.opis ? ' - ' + esc(x.opis) : '') +
      '<br><b>' + (x.zavrseno ? 'Završeno: ' + esc(x.zavrseno) : 'U toku') + '</b></div>';
  });
  return h + '</div>';
}
function realizacijaHtml(r, naslov) {
  if (!r || !r.stavke || !r.stavke.length) return '';
  let h = '<div class="k"><b>' + (naslov || ('IZVEŠTAJ O REALIZACIJI ODLUKA SA PRETHODNE SEDNICE (' + esc(r.datum) + ')')) + '</b>';
  r.stavke.forEach(function (x) {
    h += '<div style="margin-top:8px"><b>Tačka ' + x.br + '.</b> ' + esc(x.tacka) + '<br><b>' + (x.status ? esc(x.status) : 'nije označeno') + '</b>' + (x.napomena ? ' - ' + esc(x.napomena) : '') + '</div>';
  });
  return h + '</div>';
}

function istorija() {
  clearInterval(tajmer);
  rpc('istorija_zapisnika', L).then(function (r) {
    if (r.greska) { alert(r.greska); return; }
    let h = '<div class="k"><b>ISTORIJA ZAPISNIKA - ' + esc(ZGR) + '</b>';
    if (!r.length) h += '<div style="margin-top:8px">Još nema završenih sednica.</div>';
    r.forEach(function (z) {
      h += '<button onclick="otvoriZ(' + z.id + ')">' + esc(z.datum) + ' ' + esc(z.vreme) + ' - ' + esc(z.mesto) + '</button>';
    });
    h += '</div><button class="uz" onclick="ucitaj()">NAZAD</button>';
    document.getElementById('sadrzaj').innerHTML = h;
  }).catch(function (e) { alert('Greška: ' + e.message); });
}

function otvoriZ(id) {
  rpc('zapisnik_prikaz', Object.assign({ p_id: id }, L)).then(function (d) {
    if (d.greska) { alert(d.greska); return; }
    const s = d.sednica, q = d.kvorum;
    let h = '<div class="k"><b>ZAPISNIK SA SEDNICE' + (s.ponovljena ? ' (PONOVLJENA SEDNICA)' : '') + '</b><br><b>ZGRADA:</b> ' + esc(s.zgrada) +
      '<br><b>BROJ POSEBNIH DELOVA:</b> ' + s.ukupno +
      '<br><b>SASTANAK DANA:</b> ' + esc(s.datum) + ' u ' + esc(s.vreme) +
      '<br><b>MESTO SASTANKA:</b> ' + esc(s.mesto) +
      '<br><b>PRISUTNO:</b> ' + q.prisutno + ' od ' + q.ukupno + ' - ' + (q.ima ? 'IMA KVORUMA' : 'NEMA KVORUMA') + '</div>';
    h += realizacijaHtml(d.realizacija);
    h += hitneHtml(d.hitne);
    h += '<div class="k"><b>DNEVNI RED</b>';
    s.tacke.forEach(function (t, i) {
      const r = d.rezultati[i], po = (d.ponude && d.ponude[i + 1]) || [];
      h += '<div style="margin-top:12px"><b>' + (i + 1) + '.</b> ' + esc(t) +
        (po.length ? '<div><b>Pristigle ponude:</b>' + ponudeHtml(po) + '</div>' : '') + rezHtml(r) + '</div>';
    });
    h += '</div>';
    h += realizacijaHtml(d.realizacija_ove, 'REALIZACIJA ODLUKA PO OVOM ZAPISNIKU');
    h += '<div class="k"><b>Napomena:</b> ' + (d.napomena ? esc(d.napomena) : '<span style="color:#999">______________________________________</span>') + '</div>';
    h += '<div class="k"><b>PRISUTNI (' + d.prisutni.length + ')</b><table><tr><th>Stan</th><th>Ime</th><th>Način</th></tr>';
    d.prisutni.forEach(function (p) {
      h += '<tr><td>' + esc(p.stan) + '</td><td>' + esc(p.ime) + '</td><td>' + esc(p.nacin) + '</td></tr>';
    });
    h += '</table></div><div class="pb" style="margin-top:40px">UPRAVNIK ZGRADE ______________________ Gavrilović Snežana</div><button onclick="window.print()">ŠTAMPAJ / SAČUVAJ PDF</button>' +
         '<button class="uz" onclick="istorija()">NAZAD NA ISTORIJU</button>';
    document.getElementById('sadrzaj').innerHTML = h;
  }).catch(function (e) { alert('Greška: ' + e.message); });
}

function odgovor(r) { if (r && r.greska) alert(r.greska); ucitaj(); }
function budiPrisutan() { rpc('prisutan', L).then(odgovor); }
function glasaj(t, g) {
  if (!confirm('Glasate ' + (String(g).indexOf('PONUDA:') === 0 ? 'ZA IZABRANU PONUDU' : g) + ' po tački ' + t + '? Glas se ne može menjati.')) return;
  rpc('glasaj', Object.assign({ p_tacka: t, p_glas: g }, L)).then(odgovor);
}
</script>
</body>
</html>
